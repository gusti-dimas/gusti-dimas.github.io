<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gusti Dimas</title>
  <style>
    :root {
      --bg: #05070d;
      --text: #fff;
      --a: #5eead4;
      --b: #818cf8;
      --c: #f472b6;
      --grid: rgba(255, 255, 255, .05)
    }

    @media (prefers-color-scheme:light) {
      :root {
        --bg: #f6f8fc;
        --text: #0f172a;
        --a: #0d9488;
        --b: #6366f1;
        --c: #ec4899;
        --grid: rgba(0, 0, 0, .06)
      }
    }

    * {
      margin: 0;
      box-sizing: border-box
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(circle at center, #000 20%, transparent 70%);
      mask-image: radial-gradient(circle at center, #000 20%, transparent 70%)
    }

    .blob {
      position: fixed;
      width: 45vmax;
      height: 45vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .35;
      animation: float 16s ease-in-out infinite alternate
    }

    .b1 {
      background: var(--a);
      top: -15%;
      left: -10%
    }

    .b2 {
      background: var(--b);
      bottom: -20%;
      right: -10%;
      animation-delay: -5s
    }

    .b3 {
      background: var(--c);
      top: 30%;
      left: 40%;
      width: 30vmax;
      height: 30vmax;
      opacity: .22;
      animation-delay: -9s
    }

    @keyframes float {
      to {
        transform: translate(8vw, -6vh) scale(1.15)
      }
    }

    #glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, color-mix(in srgb, var(--a) 35%, transparent), transparent 65%);
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
      transition: left .25s ease-out, top .25s ease-out
    }

    main {
      position: relative;
      text-align: center
    }

    h1 {
      position: relative;
      font-size: clamp(2.6rem, 11vw, 7rem);
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1;
      text-align: center;
      background: linear-gradient(110deg, var(--a), var(--b), var(--c), var(--a));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite, rise 1.2s cubic-bezier(.2, .8, .2, 1) both
    }

    @keyframes shine {
      to {
        background-position: -300% 0
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(24px);
        filter: blur(12px)
      }
    }

    h1::after {
      content: "";
      display: block;
      height: 3px;
      width: 60px;
      margin: 22px auto 0;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--a), var(--c));
      animation: grow 1.4s .6s cubic-bezier(.2, .8, .2, 1) both
    }

    @keyframes grow {
      from {
        width: 0;
        opacity: 0
      }
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 28px;
      animation: rise 1.2s .9s cubic-bezier(.2, .8, .2, 1) both
    }

    .links a {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--text);
      border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
      background: color-mix(in srgb, var(--text) 6%, transparent);
      backdrop-filter: blur(8px);
      transition: .25s
    }

    .links a:hover {
      color: var(--a);
      border-color: var(--a);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--a) 35%, transparent)
    }

    .links svg {
      width: 22px;
      height: 22px;
      fill: currentColor
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important
      }
    }
  </style>
</head>
